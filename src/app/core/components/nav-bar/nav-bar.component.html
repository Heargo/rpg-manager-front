<p-menubar [model]="items()">
  <ng-template #start>
    <svg
      class="svg-icon"
      style="
        width: 2rem;
        height: 2rem;
        vertical-align: middle;
        fill: currentColor;
        overflow: hidden;
      "
      viewBox="0 0 1024 1024"
      class="pointer"
      (click)="onGoHome()"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M512.0 44.3L840.5 234.0L512.0 234.0L183.5 234.0ZM107.0 290.0L463.5 290.0L233.4 688.2L107.0 724.8ZM917.0 290.0L917.0 724.8L790.6 688.2L560.5 290.0ZM149.9 770.6L256.0 740.0L768.0 740.0L874.1 770.6L512.0 979.7ZM512.0 318.0L723.5 684.0L300.5 684.0Z"
      />
    </svg>
  </ng-template>
  <ng-template #end>
    <div class="flex-row center middle">
      <app-host-offline-icon />
      <p-avatar
        [label]="profileBusiness.$initial()"
        [attr.title]="profileBusiness.$profile().name"
        class="pointer"
        shape="circle"
        (click)="usermenu.toggle($event)"
      />
      <p-tieredmenu #usermenu [model]="profileItems()" [popup]="true" />
    </div>
  </ng-template>
</p-menubar>
