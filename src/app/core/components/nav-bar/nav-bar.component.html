<p-menubar [model]="items()">
  <ng-template #start>
    <svg
      class="svg-icon"
      style="
        width: 2rem;
        height: 2rem;
        vertical-align: middle;
        fill: currentColor;
        overflow: hidden;
      "
      viewBox="0 0 1024 1024"
      class="pointer"
      (click)="onGoHome()"
      version="1.1"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M158.5 248.4L512.0 44.3L865.5 248.4L569.4 304.0L454.6 304.0ZM107.0 295.7L409.6 352.5L232.8 688.4L107.0 724.8ZM917.0 295.7L917.0 724.8L791.2 688.4L614.4 352.5ZM149.9 770.6L256.0 740.0L768.0 740.0L874.1 770.6L512.0 979.7ZM468.9 360.0L555.1 360.0L725.6 684.0L298.4 684.0Z"
      />
    </svg>
  </ng-template>
  <ng-template #end>
    <div class="flex-row center middle">
      @if (inRoom()) {
        <p-button
          class="close-world"
          severity="danger"
          size="small"
          icon="pi pi-sign-out"
          [label]="languageBusiness.t('nav.closeWorld')"
          (onClick)="closeWorld()"
        />
      }
      <app-host-offline-icon />
      <p-avatar
        [label]="profileBusiness.$initial()"
        [attr.title]="profileBusiness.$profile().name"
        class="pointer"
        shape="circle"
        (click)="usermenu.toggle($event)"
      />
      <p-tieredmenu
        #usermenu
        [model]="profileItems()"
        [popup]="true"
        appendTo="body"
      />
    </div>
  </ng-template>
</p-menubar>
