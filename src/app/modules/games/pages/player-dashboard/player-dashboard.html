@if(characterBusiness.$currentCharacter()){
<div class="flex-col top left main-container">
  <a routerLink="/characters/{{ characterBusiness.$currentCharacter()!.id }}"
    >See my character</a
  >
</div>
} @else {
<div class="flex-col center middle main-container">
  <img
    class="w-50"
    src="assets/illustrations/galaxie.svg"
    alt="missing character"
  />
  <p>You don't have a character yet. Let's create one and start the journey!</p>
  <button pButton routerLink="/characters/create">Create Character</button>
</div>
}
