@let c = character();
<app-portrait-card
  [name]="c.name"
  [portraitId]="c.portraitId"
  [fallbackSrc]="c.samplePortrait"
  [labelledBy]="'card-name-' + c.id"
>
  <div cardTop class="top">
    <h2 data-testid="card-name" [id]="'card-name-' + c.id">{{ c.name }}</h2>
    @if (c.className) {
      <span data-testid="card-class">{{ c.className }}</span>
    }
    <span data-testid="character-level" [attr.data-rarity]="levelRarityName()">
      <p-tag
        [severity]="levelSeverity()"
        [value]="'character.sheet.levelBadge' | transloco: { level: c.level }"
      />
    </span>
  </div>

  <div cardBottom class="bottom">
    <div class="facts">
      <div class="fact">
        <app-coin-display [copper]="c.money" />
      </div>
    </div>
    <div class="bars" data-testid="card-bars">
      @for (bar of bars(); track bar.kind) {
        <app-card-bar
          [kind]="bar.kind"
          [name]="bar.stat.name"
          [percent]="bar.stat.percent"
          [current]="bar.stat.current"
          [max]="bar.stat.max"
        />
      }
    </div>
  </div>

  @if (progress(); as p) {
    <div class="xp-pill">
      <p-progressbar
        data-testid="xp-progress"
        [value]="p.percent"
        [showValue]="false"
        [attr.aria-label]="'character.sheet.xp' | transloco"
      />
      @if (p.maxed) {
        <span data-testid="xp-text">{{
          "character.sheet.maxLevel" | transloco
        }}</span>
      } @else {
        <span data-testid="xp-text"
          >{{ p.xpIntoLevel }} / {{ p.xpForNext }}</span
        >
      }
    </div>
  }
</app-portrait-card>
