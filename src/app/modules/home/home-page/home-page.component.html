<div class="landing">
  <div class="below">
    <section class="content main-container" data-test="content">
      <div class="intro">
        <div class="text">
          <h2 class="heading">{{ "home.heading" | transloco }}</h2>
          <p class="lead" data-test="pitch">{{ "home.pitch" | transloco }}</p>
          <div class="actions">
            <a routerLink="/play" data-test="cta-play" class="cta primary">{{
              "home.ctaPlay" | transloco
            }}</a>
            <a routerLink="/tools/links" data-test="cta-tools" class="cta">{{
              "home.ctaTools" | transloco
            }}</a>
          </div>
        </div>
        <div class="window">
          <img
            data-test="screenshot"
            src="images/landing-screenshot.webp"
            width="776"
            height="1102"
            [alt]="'home.screenshotAlt' | transloco"
          />
        </div>
      </div>
      <ul
        class="highlights"
        data-test="highlights"
        [attr.aria-label]="'home.highlightsLabel' | transloco"
      >
        @for (item of highlights; track item.key) {
          <li class="card" data-test="highlight">
            <i class="pi {{ item.icon }}" aria-hidden="true"></i>
            <h3>{{ "home." + item.key + "Title" | transloco }}</h3>
            <p>{{ "home." + item.key + "Text" | transloco }}</p>
          </li>
        }
      </ul>
    </section>
    <app-site-footer />
  </div>
</div>
