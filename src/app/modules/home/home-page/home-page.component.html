<div class="main-container landing">
  <section class="hero">
    <div class="text">
      <h1>{{ "home.title" | transloco }}</h1>
      <p data-test="pitch">{{ "home.pitch" | transloco }}</p>
      <div class="actions">
        <a routerLink="/play" data-test="cta-play" class="cta primary">{{
          "home.ctaPlay" | transloco
        }}</a>
        <a routerLink="/tools/links" data-test="cta-tools" class="cta">{{
          "home.ctaTools" | transloco
        }}</a>
      </div>
    </div>
    <img
      data-test="screenshot"
      src="images/landing-screenshot.webp"
      width="580"
      height="480"
      [alt]="'home.screenshotAlt' | transloco"
    />
  </section>
  <footer>
    <a routerLink="/credits" data-test="footer-credits">{{
      "home.footerCredits" | transloco
    }}</a>
    <a routerLink="/contact" data-test="footer-contact">{{
      "home.footerContact" | transloco
    }}</a>
    <a routerLink="/privacy-policy" data-test="footer-privacy">{{
      "home.footerPrivacy" | transloco
    }}</a>
  </footer>
</div>
